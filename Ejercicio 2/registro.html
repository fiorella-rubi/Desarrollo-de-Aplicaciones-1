<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <style>
        form {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #999;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
        input:invalid {
            border: 1px solid red;
        }
        input:valid {
            border: 1px solid green;
        }
    </style>
</head>

<body>

    <h1>Formulario de Registro</h1>
    <form action="#" method="post">

    <label for="nombre">Nombre:</label>
    <input 
        type="text"
        id="nombre"
        name="nombre"
        required
        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,30}"
        minlength="3"
        maxlength="30"
        placeholder="Ingrese su nombre"
        title="El nombre debe tener entre 3 y 30 caracteres y solo puede contener letras y espacios">

    <label for="correo">Correo electronico:</label>
    <input 
        type="email"
        id="correo"
        name="correo"
        required
        placeholder="ejemplo@correo.com"
        title="Ingrese un correo electrónico válido">

    <label for="telefono">Telefono:</label>
    <input 
        type="tel"
        id="telefono"
        name="telefono"
        required
        pattern="[0-9]{9}"
        minlength="9"
        maxlength="9"
        placeholder="987654321"
        title="El telefono debe contener exactamente 9 numeros">

    <label for="fecha">Fecha de nacimiento:</label>
    <input 
        type="date"
        id="fecha"
        name="fecha"
        required
        title="Seleccione su fecha de nacimiento">

    <label for="usuario">Usuario:</label>
    <input 
        type="text"
        id="usuario"
        name="usuario"
        required
        pattern="[A-Za-z0-9]{4,15}"
        minlength="4"
        maxlength="15"
        placeholder="Ingrese su usuario"
        title="El usuario debe tener entre 4 y 15 caracteres y solo puede contener letras y numeros">

    <label for="contrasena">Contraseña:</label>
    <input 
        type="password"
        id="contrasena"
        name="contrasena"
        required
        minlength="8"
        maxlength="20"
        pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,20}"
        placeholder="Ingrese su contraseña"
        title="La contraseña debe tener entre 8 y 20 caracteres e incluir al menos una letra y un numero">

    <button type="submit">Registrarse</button>

</form>
</body>
</html>
