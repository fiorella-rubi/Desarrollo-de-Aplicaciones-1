<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>School timetable</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      border: 2px solid #ccc;
      text-align: center;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px 15px;
      height: 40px;
      min-width: 60px;
    }

    tbody th {
      text-align: center;
      font-weight: normal;
    }
  </style>
</head>
<body>

  <h1>School timetable</h1>

  <table>
    <colgroup>
      <col>
      <col>

      <col style="background-color:#97DB9A;">

      <col style="width: 42px;">

      <col style="background-color:#97DB9A;">

      <col style="background-color:#DCC48E; border:4px solid #C1437A;">

      <col style="width: 42px;" span="2">
    </colgroup>

    <thead>
      <tr>
        <th>&nbsp;</th>
        <th>Mon</th>
        <th>Tues</th>
        <th>Wed</th>
        <th>Thurs</th>
        <th>Fri</th>
        <th>Sat</th>
        <th>Sun</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>1st period</th>
        <td>English</td>
        <td></td>
        <td></td>
        <td>German</td>
        <td>Dutch</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <th>2nd period</th>
        <td>English</td>
        <td>English</td>
        <td></td>
        <td>German</td>
        <td>Dutch</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <th>3rd period</th>
        <td></td>
        <td>German</td>
        <td></td>
        <td>German</td>
        <td>Dutch</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <th>4th period</th>
        <td></td>
        <td>English</td>
        <td></td>
        <td>English</td>
        <td>Dutch</td>
        <td></td>
        <td></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
