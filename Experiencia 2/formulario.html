<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Practica 02 - Formulario Web</title>

    <style>
        form {
            margin: 0 auto;
            width: 400px;
            /*esquema del formulario*/
            padding: 1em;
            border: 1px solid #CCC;
            border-radius: 1em;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        form li + li {
            margin-top: 1em;
        }
        label {
            display: inline-block;
            width: 90px;
            text-align: right;
        }
        input,
        textarea {
            font: 1em sans-serif;
            width: 300px;
            box-sizing: border-box;
            border: 1px solid #999;
        }
        input:focus,
        textarea:focus {
            /*destacado cuando esta selecionado*/
            border-color: #000;
        }
        textarea {
            /*alineacion*/
            vertical-align: top;
            /*espacio para escribir*/
            height: 5em;
        }
        .button {
            /*alineacion*/
            padding-left: 90px;
        }
        button {
            margin-left: .5em;
        }
    </style>
</head>



<body>

    <h1>Experiencia de Practica N-02</h1>
    <h2>Formulario Web</h2>

    <form action="/my-handling-form-page" method="post">
        <ul>
            <li>
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="user_name">
            </li>

            <li>
                <label for="mail">Correo electrónico:</label>
                <input type="email" id="mail" name="user_mail">
            </li>

            <li>
                <label for="msg">Mensaje:</label>
                <textarea id="msg" name="user_message"></textarea>
            </li>

            <li class="button">
                <button type="submit">Envíe su mensaje</button>
            </li>
        </ul>
    </form>
</body>
</html>
